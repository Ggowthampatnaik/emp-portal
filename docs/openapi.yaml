    CompleteProfileRequest:
      type: object
      description: |-
        The first thing a new employee ever fills in (F18).

        Every field here is mandatory: the flag flips only when the whole set is
        present, so "complete" means the same thing to the gate as it does to the
        person filling the form. Anything optional - skills, education documents,
        experience - belongs on My Profile afterwards, not in the way of getting in.
      properties:
        phone:
          type: string
          minLength: 1
          pattern: ^[0-9+\-\s()]{6,20}$
          maxLength: 20
        date_of_birth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/GenderEnum'
        blood_group:
          allOf:
          - $ref: '#/components/schemas/BloodGroupEnum'
          description: |-
            Kept for emergency contact purposes only.

            * `A+` - A+
            * `A-` - A-
            * `B+` - B+
            * `B-` - B-
            * `AB+` - AB+
            * `AB-` - AB-
            * `O+` - O+
            * `O-` - O-
        permanent_address:
          type: string
          minLength: 1
          description: Home address of record, used for statutory paperwork.
        current_address:
          type: string
          minLength: 1
          description: Where the employee lives now, when it differs from the permanent
            one.
        emergency_contact_name:
          type: string
          minLength: 1
          maxLength: 120
        emergency_contact_phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - blood_group
      - current_address
      - date_of_birth
      - emergency_contact_name
      - emergency_contact_phone
      - gender
      - permanent_address
      - phone
