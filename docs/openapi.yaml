          description: No response body
  /api/v1/employees/{id}/bank-account/:
    get:
      operationId: employees_bank_account_retrieve
      description: Salary bank account. GET returns the masked number to everyone;
        the full number is included only when the owner reads their own record. Readable
        and writable by the employee and by HR (`bank.manage`) - reporting managers
        are excluded.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee.
        required: true
      tags:
      - employees
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
