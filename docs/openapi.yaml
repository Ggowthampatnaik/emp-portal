        required: true
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
          description: ''
    patch:
      operationId: employees_partial_update
      description: |-
        Employees.

        Visibility follows :mod:`common.scoping` - HR/Admin see everyone, a manager
