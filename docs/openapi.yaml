    BankAccount:
      type: object
      description: |-
        Bank details.

        ``account_number`` is write-only. Reads get ``account_number_masked``
        always, and ``account_number`` only when the owner is looking at their own
        record (decision D9) - HR can maintain the details without being able to
        read them back out of a support screen.
      properties:
        id:
          type: integer
          readOnly: true
        employee_code:
          type: string
          readOnly: true
        account_holder_name:
          type: string
          description: Exactly as printed on the passbook.
          maxLength: 120
        bank_name:
          type: string
          maxLength: 120
        branch_name:
          type: string
          maxLength: 120
        account_number_masked:
          type: string
          readOnly: true
        ifsc_code:
          type: string
          maxLength: 11
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        account_type_label:
          type: string
          readOnly: true
        updated_by_name:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_holder_name
      - account_number_masked
      - account_type_label
      - bank_name
      - employee_code
      - id
      - ifsc_code
      - updated_at
      - updated_by_name
    BankAccountRequest:
      type: object
      description: |-
        Bank details.

        ``account_number`` is write-only. Reads get ``account_number_masked``
        always, and ``account_number`` only when the owner is looking at their own
        record (decision D9) - HR can maintain the details without being able to
        read them back out of a support screen.
