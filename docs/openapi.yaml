    LeaveRequestCreateRequest:
      type: object
      description: Write shape for applying. The day count is computed, never submitted.
      properties:
        leave_type:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        day_part:
          allOf:
          - $ref: '#/components/schemas/DayPartEnum'
          default: full
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        contact_number:
          type: string
          maxLength: 20
        cc_user_ids:
          type: array
          items:
            type: integer
          maxItems: 10
      required:
      - end_date
      - leave_type
      - reason
      - start_date
    LeaveSendBackRequest:
      type: object
      description: HR returning a request to the manager. The reason is not optional
        (D2).
      properties:
        comment:
          type: string
          minLength: 5
          maxLength: 1000
      required:
      - comment
    LeaveStageStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - sent_back
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `sent_back` - Sent back to manager
    LeaveStatusEnum:
      enum:
      - pending_manager
      - pending_hr
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending_manager` - Pending manager
        * `pending_hr` - Pending HR
        * `approved` - Approved
        * `rejected` - Rejected
        * `cancelled` - Cancelled
    LeaveType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        description:
          type: string
        days_per_year:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
        is_paid:
          type: boolean
        requires_approval:
          type: boolean
        max_consecutive_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Blank means no limit.
        allow_half_day:
          type: boolean
        carry_forward:
          type: boolean
          description: Unused days roll into next year's allocation.
        is_active:
          type: boolean
      required:
      - code
      - days_per_year
      - id
      - name
    LeaveTypeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        days_per_year:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
        is_paid:
          type: boolean
        requires_approval:
          type: boolean
        max_consecutive_days:
