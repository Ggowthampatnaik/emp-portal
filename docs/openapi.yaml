  /api/v1/employees/{id}/deletion-request/:
    get:
      operationId: employees_deletion_request_retrieve
      description: Ask for this account to be closed. HR raises it; an administrator
        decides (`employee.approve_deletion`). Approving **deactivates** - nothing
        is deleted, and the person's leave, timesheets and payslips are untouched.
        GET returns the most recent request, so the button can show what is already
        in flight; DELETE withdraws an open one.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee.
        required: true
      tags:
      - employees
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequest'
          description: ''
    delete:
      operationId: employees_deletion_request_destroy
