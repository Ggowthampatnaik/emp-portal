openapi: 3.0.3
info:
  title: Trigyan Employee Management Portal API
  version: 1.0.0
  description: REST API for employee, project, leave and timesheet management. Authentication
    is Microsoft Entra ID SSO exchanged for a portal JWT; every endpoint is guarded
    by role-based access control.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        ``POST /api/v1/auth/login`` - email and password.

        Used for local accounts. Company SSO goes through the Entra ID exchange
        endpoint instead; both return the same portal JWT pair.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: '``POST /api/v1/auth/logout`` - records the event; the SPA drops
        its tokens.'
      tags:
      - auth
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: '``POST /api/v1/auth/password/change`` - signed-in user changes
        own password.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/forgot/:
    post:
      operationId: auth_password_forgot_create
      description: Sends a temporary password to the address if it belongs to an active
        account. Answers 204 either way.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: '``POST /api/v1/auth/token/refresh``'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: '``GET /api/v1/auth/me`` - identity, roles and permission codes.'
      tags:
      - auth
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/entra/exchange/:
    post:
      operationId: auth_entra_exchange_create
      description: Exchange a Microsoft Entra ID access token for a portal JWT pair.
      tags:
      - auth
      security:
      - BearerEntraID: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntraExchangeResponse'
          description: ''
  /api/v1/employees/:
    get:
      operationId: employees_list
      description: Employee directory, scoped to what the caller may see.
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: designation
        schema:
          type: integer
      - in: query
        name: employment_status
        schema:
          type: string
          enum:
          - active
          - inactive
          - on_notice
        description: |-
          * `active` - Active
          * `on_notice` - On Notice
          * `inactive` - Inactive
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: reporting_manager
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - employees
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeListList'
          description: ''
    post:
      operationId: employees_create
      description: |-
        Employees.

        Visibility follows :mod:`common.scoping` - HR/Admin see everyone, a manager
        sees their reporting branch, an employee sees only themselves. ``/me`` is
        always available, and an employee may edit a limited set of their own fields.
      tags:
      - employees
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
        required: true
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeCreate'
          description: ''
  /api/v1/employees/directory/:
    get:
      operationId: employees_directory_list
      description: 'Company directory: every active employee, readable by any signed-in
        user. Carries work contact details only - the scoped /employees/ list remains
        the source for full records.'
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: designation
        schema:
          type: integer
      - in: query
        name: employment_status
        schema:
          type: string
          enum:
          - active
          - inactive
          - on_notice
        description: |-
          * `active` - Active
          * `on_notice` - On Notice
          * `inactive` - Inactive
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: reporting_manager
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - employees
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeDirectoryList'
          description: ''
  /api/v1/employees/directory/{employee_id}/:
    get:
      operationId: employees_directory_retrieve
      description: One directory entry, expanded with the person's direct reports.
        Readable by any signed-in user; carries work details only.
      parameters:
      - in: path
        name: employee_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - employees
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDirectoryDetail'
          description: ''
  /api/v1/employees/me/:
