  securitySchemes:
    BearerEntraID:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Microsoft Entra ID access token acquired by the SPA via MSAL. Accepted
        only by /api/v1/auth/entra/exchange/, which returns the portal JWT pair used
        for every other endpoint.
    BearerPortalJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Portal JWT issued by /api/v1/auth/login/ or the Entra ID exchange.
        Carries the account's roles and its token version - a password reset bumps
        the version and retires every token issued before it.
