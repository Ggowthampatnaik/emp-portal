        * `success` - Success
        * `warning` - Warning
        * `error` - Error
    LoginRequest:
      type: object
      description: |-
        Email + password sign-in.

        Deliberately vague on failure: one message covers "no such account", "wrong
        password" and "deactivated", so the endpoint cannot be used to enumerate who
        works here.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    ModuleEnum:
      enum:
