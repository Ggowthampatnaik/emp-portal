  /api/v1/employees/search/:
    get:
      operationId: employees_search_list
      description: Type-ahead over active employees, for pickers such as the leave
        CC field. Readable by any signed-in user and carries work details only, like
        the directory. Matches a **prefix** of the first or last name, or of the employee
        code.
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: designation
        schema:
          type: integer
      - in: query
        name: employment_status
        schema:
          type: string
          enum:
          - active
          - inactive
          - on_notice
        description: |-
          * `active` - Active
          * `on_notice` - On Notice
          * `inactive` - Inactive
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Prefix of a first or last name.
      - in: query
        name: reporting_manager
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - employees
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeSearchList'
          description: ''
  /api/v1/employees/{id}/:
    get:
      operationId: employees_retrieve
