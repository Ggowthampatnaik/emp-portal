    get:
      operationId: finance_approvals_list
      description: |-
        Payslips HR has pushed to Finance, and Finance's decision on each.

        Finance sees pay figures and nothing else about an employee: this module
        deliberately carries no route into the employee record, the leave history
        or the timesheets.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payslip__employee
        schema:
          type: integer
      - in: query
        name: payslip__run
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - pending
          - processed
          - queried
        description: |-
          * `pending` - Waiting for HR
          * `processed` - With Finance
          * `approved` - Released
          * `queried` - Queried by Finance
      tags:
      - finance
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
