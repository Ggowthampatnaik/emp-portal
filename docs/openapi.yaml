          - cancelled
          - pending
          - rejected
        description: |-
          * `pending` - Pending
          * `approved` - Approved
          * `rejected` - Rejected
          * `cancelled` - Cancelled
      tags:
      - admin
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountDeletionRequestList'
          description: ''
  /api/v1/admin/deletion-requests/{id}/:
    get:
      operationId: admin_deletion_requests_retrieve
      description: |-
        Account closure requests raised by HR, decided here.

        Approving deactivates the account and nothing more: no row is removed, so
        the person's leave, timesheets and payslips survive them leaving. Whoever
        raised the request cannot decide on it - see
        :mod:`apps.employees.services`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account deletion request.
        required: true
      tags:
      - admin
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequest'
          description: ''
  /api/v1/admin/deletion-requests/{id}/approve/:
    post:
      operationId: admin_deletion_requests_approve_create
      description: 'Approve: deactivate the account. Records are kept.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this account deletion request.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountDeletionDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountDeletionDecisionRequest'
      security:
      - BearerEntraID: []
      - BearerPortalJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequest'
          description: ''
  /api/v1/admin/deletion-requests/{id}/reject/:
    post:
      operationId: admin_deletion_requests_reject_create
      description: Decline the request. The employee stays active; a reason is required.
      parameters:
