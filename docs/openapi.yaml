          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequest'
          description: ''
components:
  schemas:
    AccountDeletionCreateRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 1000
      required:
      - reason
    AccountDeletionDecisionRequest:
      type: object
      description: Approve carries an optional note; reject requires one (see the
        service).
      properties:
        note:
          type: string
          default: ''
          maxLength: 1000
    AccountDeletionRequest:
      type: object
      description: A closure request, as both HR and the deciding administrator see
        it.
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
          readOnly: true
        employee_code:
          type: string
          readOnly: true
        employee_name:
          type: string
          readOnly: true
        employee_email:
          type: string
          format: email
          readOnly: true
        department_name:
          type: string
          readOnly: true
        designation_name:
          type: string
          readOnly: true
        employment_status:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
          description: Why the account should be closed.
        status:
          allOf:
          - $ref: '#/components/schemas/AccountDeletionStatusEnum'
          readOnly: true
        is_open:
          type: boolean
          readOnly: true
        requested_by:
          type: integer
          readOnly: true
          nullable: true
        requested_by_name:
          type: string
          readOnly: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        decided_by_name:
          type: string
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decision_note:
          type: string
          readOnly: true
      required:
      - decided_at
      - decided_by_name
      - decision_note
      - department_name
      - designation_name
      - employee
      - employee_code
      - employee_email
      - employee_name
      - employment_status
      - id
      - is_open
      - reason
      - requested_at
      - requested_by
      - requested_by_name
      - status
    AccountDeletionStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `cancelled` - Cancelled
    AccountTypeEnum:
      enum:
      - savings
      - current
      - salary
      type: string
      description: |-
        * `savings` - Savings
        * `current` - Current
        * `salary` - Salary
    ApprovalStatusEnum:
      enum:
      - draft
