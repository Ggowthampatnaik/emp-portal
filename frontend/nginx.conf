server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at Azure Front Door / Application Gateway; keep the
    # security headers the SPA itself is responsible for.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # What the page may load, and from where. React's escaping is the only
    # thing between a future third-party widget and a token in sessionStorage;
    # this makes that class of mistake fail closed. Every source below is one
    # the SPA actually uses:
    #   scripts       - its own bundle only (Vite emits no inline scripts)
    #   styles        - MUI writes styles at runtime, hence 'unsafe-inline';
    #                   the Inter/Quicksand stylesheet comes from Google Fonts
    #   fonts         - the font files those stylesheets pull from gstatic
    #   images        - the API's media in dev, Azure Blob SAS URLs deployed
    #   connect       - the API (same origin), Entra ID's token endpoint, and
    #                   blob storage; add the API origin here if it ever moves
    #                   off this host
    #   frames        - MSAL renews tokens in a hidden Entra ID iframe
    # frame-ancestors repeats X-Frame-Options for browsers that prefer CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.blob.core.windows.net; connect-src 'self' https://login.microsoftonline.com https://*.blob.core.windows.net; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: every unknown path renders the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
