# ---------------------------------------------------------------------------
# Render Blueprint: PostgreSQL, the Django API, and the React SPA.
# Dashboard -> New -> Blueprint -> pick this repository. Values marked
# `sync: false` are asked for when the Blueprint is created. See DEPLOY_RENDER.md.
# ---------------------------------------------------------------------------

databases:
  - name: emp-portal-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"   # the version database/emp_portal_postgres.sql.gz came from
    databaseName: emp_portal
    user: emp_portal

services:
  # --- Django API -----------------------------------------------------------
  # Native Python rather than backend/Dockerfile: that image runs as a non-root
  # user, which a Render disk is not guaranteed to be writable by. The
  # Dockerfile stays as it is for Azure.
  - type: web
    name: emp-portal-api
    runtime: python
    plan: starter                # a persistent disk needs a paid plan
    region: singapore
    rootDir: backend
    buildCommand: >-
      pip install --upgrade pip &&
      pip install --require-hashes -r requirements/prod.lock &&
      python manage.py collectstatic --noinput
    # Migrations run on every start (a no-op when there is nothing new), so a
    # deploy never serves code ahead of its schema.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py seed_rbac &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
      --workers 2 --threads 2 --timeout 60
      --access-logfile - --error-logfile -
    healthCheckPath: /healthz/
    disk:
      name: media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.render
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: emp-portal-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /opt/render/project/src/backend/media
      - key: TIME_ZONE
        value: Asia/Kolkata
      # Render's proxy appends one address to X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # emp-portal-api.onrender.com (plus any custom domain, comma-separated)
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # https://emp-portal-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # https://emp-portal-web.onrender.com - links in emails point here
      - key: FRONTEND_BASE_URL
        sync: false
      # SMTP is mandatory: production refuses to start without it.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # --- React SPA ------------------------------------------------------------
  - type: web
    name: emp-portal-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Client-side routing: every unknown path renders the SPA.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      # https://emp-portal-api.onrender.com/api/v1 - baked into the bundle at build time
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_NAME
        value: Trigyan Employee Portal
